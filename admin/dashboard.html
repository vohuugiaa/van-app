<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Đội Van</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #f8fafc; padding: 0; }
        .dashboard-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { font-size: 1.5rem; font-weight: 800; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 20px; box-shadow: var(--shadow); border-bottom: 4px solid var(--primary-blue); }
        .stat-card h3 { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; }
        .stat-card p { font-size: 1.8rem; font-weight: 800; color: var(--text-main); }

        .data-card { background: white; border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
        .table-header { padding: 20px; border-bottom: 1px solid #edf2f7; display: flex; justify-content: space-between; align-items: center; }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px 20px; background: #f8fafc; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
        td { padding: 15px 20px; border-bottom: 1px solid #edf2f7; font-size: 0.95rem; }
        
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
        .badge-in { background: #e8f8f5; color: #1abc9c; }
        .badge-out { background: #fef9e7; color: #f1c40f; }
        
        .btn-view { padding: 6px 12px; border-radius: 8px; border: 1px solid #edf2f7; background: white; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; text-decoration: none; color: inherit; display: inline-block; margin-right: 5px; }
        .btn-view:hover { background: #f1f5f9; border-color: #cbd5e1; }

        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: flex; justify-content: center; align-items: center; z-index: 100; flex-direction: column; gap: 15px; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-blue); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            td, th { padding: 10px; font-size: 0.8rem; }
            .btn-view { padding: 4px 8px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
        <p>Đang tải dữ liệu từ server Google...</p>
    </div>

    <div class="dashboard-container">
        <header class="header">
            <div>
                <h1>Quản Lý Đội Van</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Dữ liệu chấm công thời gian thực</p>
            </div>
            <button class="btn-logout" onclick="location.href='../index.html'">Thoát</button>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Tổng lượt Check-in</h3>
                <p id="stat-total">0</p>
            </div>
            <div class="stat-card" style="border-color: var(--primary-teal);">
                <h3>Hôm nay</h3>
                <p id="stat-today">0</p>
            </div>
        </div>

        <div class="data-card">
            <div class="table-header">
                <h2 style="font-size: 1.1rem;">Lịch sử Hoạt động</h2>
                <button class="btn-view" onclick="loadData()">🔄 Làm mới</button>
            </div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Thời gian</th>
                            <th>Tài xế</th>
                            <th>Mã NV</th>
                            <th>Loại</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="data-table">
                        <!-- Data will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwENfLXgkcNVX6NOUojt-r6uFo7WRZg1Rbr2_Xph1IcwiISgJEeN15yDID87zZdIS2R/exec";

        async function loadData() {
            document.getElementById('loading').style.display = 'flex';
            try {
                const response = await fetch(SCRIPT_URL + "?action=read");
                const data = await response.json();
                renderData(data);
            } catch (error) {
                console.error("Lỗi:", error);
                alert("Không thể tải dữ liệu. Hãy đảm bảo bạn đã cấu hình SCRIPT_URL đúng!");
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function renderData(rows) {
            const tbody = document.getElementById('data-table');
            tbody.innerHTML = '';
            
            // Statistics
            document.getElementById('stat-total').innerText = rows.length;
            const today = new Date().toLocaleDateString('vi-VN');
            const todayCount = rows.filter(r => r[0].includes(today)).length;
            document.getElementById('stat-today').innerText = todayCount;

            // Sort by time (newest first)
            rows.reverse().forEach(row => {
                const tr = document.createElement('tr');
                const typeClass = row[3] === 'Check-in' ? 'badge-in' : 'badge-out';
                
                tr.innerHTML = `
                    <td>${row[0]}</td>
                    <td><strong>${row[1]}</strong></td>
                    <td>${row[2]}</td>
                    <td><span class="badge ${typeClass}">${row[3]}</span></td>
                    <td>
                        <a href="${row[5]}" target="_blank" class="btn-view">🖼️ Ảnh</a>
                        <a href="https://www.google.com/maps?q=${row[4]}" target="_blank" class="btn-view">📍 Vị trí</a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.onload = loadData;
    </script>
</body>
</html>
